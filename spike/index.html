<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cap TD – Phase 0 Spike</title>
    <style>
      /* Theme: Kenney UI Pack (CC0). Panels/buttons are 9-sliced from the @2x "Double" PNGs. */
      @font-face { font-family: 'Kenney Future'; src: url('ui/kenney-ui/Font/Kenney%20Future.ttf') format('truetype'); font-display: block; }
      @font-face { font-family: 'Kenney Future Narrow'; src: url('ui/kenney-ui/Font/Kenney%20Future%20Narrow.ttf') format('truetype'); font-display: block; }
      :root {
        --ink: #2b3a4a;
        --ink-soft: #6b7c8f;
        --sky: #9fc6e6;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: 'Kenney Future Narrow', system-ui, sans-serif; color: var(--ink); }
      canvas { display: block; }
      button { font: inherit; color: inherit; }

      /* --- 9-slice primitives --- */
      .panel {
        border-style: solid; border-width: 12px 12px 16px;
        border-image: url('ui/kenney-ui/PNG/Grey/Double/button_square_depth_flat.png') 24 24 32 fill / 12px 12px 16px;
        padding: 2px 6px;
      }
      .btn {
        cursor: pointer; background: none; padding: 0 10px; min-width: 64px; height: 44px; line-height: 16px;
        border-style: solid; border-width: 12px 12px 16px;
        border-image: url('ui/kenney-ui/PNG/Blue/Double/button_rectangle_depth_gradient.png') 24 24 32 fill / 12px 12px 16px;
        color: #fff; font-family: 'Kenney Future', system-ui, sans-serif; font-size: 14px; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
        transition: filter 0.1s;
      }
      .btn:hover { filter: brightness(1.08); }
      /* Pressed: swap to the flat sprite and drop by the depth so the button "sinks". */
      .btn:active {
        border-image: url('ui/kenney-ui/PNG/Blue/Double/button_rectangle_gradient.png') 24 fill / 12px;
        border-width: 12px; height: 40px; margin-top: 4px;
      }
      .btn.active { border-image-source: url('ui/kenney-ui/PNG/Yellow/Double/button_rectangle_depth_gradient.png'); color: var(--ink); text-shadow: none; }
      .btn.active:active { border-image-source: url('ui/kenney-ui/PNG/Yellow/Double/button_rectangle_gradient.png'); }

      /* --- HUD --- */
      #hud { position: fixed; top: 10px; left: 10px; min-width: 230px; pointer-events: none; }
      #hud h1 { margin: 0 0 6px; font: 13px 'Kenney Future', sans-serif; letter-spacing: 0.04em; color: var(--ink); }
      #hud .divider { height: 2px; margin: 0 0 6px; background: url('ui/kenney-ui/PNG/Extra/Default/divider.png') center / 100% 2px no-repeat; opacity: 0.6; }
      #hud dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; font-size: 13px; }
      #hud dt { color: var(--ink-soft); }
      #hud dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      #hud dd.good { color: #1e9e5a; } #hud dd.warn { color: #c98a00; } #hud dd.bad { color: #d2343f; }

      #score { position: fixed; top: 10px; right: 10px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
      #score img { width: 28px; height: 26px; }
      #score span { font: 18px 'Kenney Future', sans-serif; min-width: 60px; text-align: right; font-variant-numeric: tabular-nums; }

      #controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; }
      #controls .label { font: 12px 'Kenney Future', sans-serif; padding: 0 6px; }
      #controls .row { display: flex; gap: 6px; height: 48px; align-items: flex-start; }

      /* --- Loading screen --- */
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #2d9be0; color: #fff; z-index: 10; transition: opacity 0.4s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .box { display: grid; gap: 18px; justify-items: center; }
      #loading h2 { margin: 0; font: 34px 'Kenney Future', sans-serif; text-shadow: 0 3px 0 #1b6fa8; }
      #loading .bar { width: 300px; height: 14px; padding: 2px; border-style: solid; border-width: 10px 10px 14px;
                      border-image: url('ui/kenney-ui/PNG/Grey/Double/button_rectangle_depth_flat.png') 24 24 32 fill / 10px 10px 14px; }
      #loading .fill { height: 100%; width: 0; min-width: 14px; box-sizing: border-box; border-style: solid; border-width: 7px;
                       border-image: url('ui/kenney-ui/PNG/Yellow/Double/button_rectangle_flat.png') 24 fill / 7px; transition: width 0.15s; }
      #loading .msg { font-size: 14px; opacity: 0.9; }

      @media (max-width: 600px) {
        #hud { transform: scale(0.68); transform-origin: top left; }
        #score { transform: scale(0.8); transform-origin: top right; }
        #controls { width: calc(100% - 32px); flex-wrap: wrap; justify-content: center; }
        #controls .row { flex-wrap: wrap; justify-content: center; height: auto; }
        .btn { min-width: 0; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="box">
        <h2>Cap Tower Defense</h2>
        <div class="bar"><div class="fill"></div></div>
        <div class="msg">Loading models…</div>
      </div>
    </div>
    <div id="hud" class="panel"></div>
    <div id="score" class="panel"><img src="ui/kenney-ui/PNG/Yellow/Default/star.png" alt="" /><span>0</span></div>
    <div id="controls" class="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
